{% extends "base.html" %}
{% block title %}HR-AI Projects{% endblock %}
{% block content %}
<h1 class="page-title">AI Projects in HR&nbsp;Management</h1>

<div class="video-grid">
  {% for p in projects %}
    <div class="video-card">
      {% if p.video.startswith('http') %}
        <!-- YouTube / 其他平台 -->
        <iframe src="{{ p.video | replace('watch?v=','embed/') }}"
                loading="lazy" allow="autoplay; encrypted-media"
                frameborder="0"></iframe>
      {% else %}
        <!-- 本地 mp4 -->
        <video controls>
          <source src="{{ url_for('static', filename='video/' ~ p.video) }}" type="video/mp4">
        </video>
      {% endif %}
      <h3>{{ p.title }}</h3>
      <p>{{ p.desc }}</p>
    </div>
  {% endfor %}
</div>
{% endblock %}
