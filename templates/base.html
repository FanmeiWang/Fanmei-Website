<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Fanmei Wang, PhD{% endblock %}</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}">

  {% block extra_css %}{% endblock %}
</head>
<body>

  {% include "navbar.html" %}

  {% block content %}{% endblock %}

  <footer>© {{ current_year }} Fanmei Wang, 2025</footer>
{# ── Chatbot: minimal, isolated, no global CSS ── #}
<link rel="stylesheet" href="{{ url_for('static', filename='chatbot/fm-bot.css') }}">
<div id="fm-bot-root" class="fm-bot--dock" aria-live="polite"></div>

<script>
  /* 站内“知识库”：只回答网站相关问题；链接都指向你现有的页面 */
  window.fmBotKB = [
    {
      q: ["who is fanmei", "who is fanmei wang", "introduction", "profile", "resume", "cv"],
      a: "I'm Fanmei Wang. See <a href='{{ url_for('about') }}' target='_self'>About</a> for a short profile."
    },
    {
      q: ["ai projects", "show me ai projects", "ai", "presentation", "video"],
      a: "All AI demos are here: <a href='{{ url_for('projects_ai') }}' target='_self'>AI Projects</a>."
    },
    {
      q: ["azure architecture", "architecture", "animated architecture", "azure demo"],
      a: "Open the step-by-step animated Azure Architecture demo: <a href='{{ url_for('projects') }}#azure-arch' target='_self'>Azure Architecture (Animated)</a>."
    },
    {
      q: ["teaching", "courses", "teach", "teaching experience"],
      a: "Teaching overview: <a href='{{ url_for('teaching_overview') }}' target='_self'>Teaching</a>."
    },
    {
      q: ["publications", "thesis", "paper", "publish"],
      a: "See the list of books & papers on <a href='{{ url_for('publications') }}' target='_self'>Publications</a>."
    },
    {
      q: ["contact", "how can i contact you", "contact", "email"],
      a: "You can reach me via the info on <a href='{{ url_for('about') }}#contact' target='_self'>About → Contact</a>."
    }
  ];

  /* Quick chips（常用入口） */
  window.fmBotChips = [
    "Who is Fanmei Wang?",
    "Show me AI projects",
    "Where is the Azure Architecture demo?",
    "How can I contact you?"
  ];
</script>

<script defer src="{{ url_for('static', filename='js/fmw-chat.js') }}"></script>

</body>
</html>
