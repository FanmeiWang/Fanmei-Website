{# templates/projects.html #}
{% extends "base.html" %}
{% block title %}Projects — Fanmei Wang, PhD{% endblock %}

{% block extra_css %}
  <!-- 仅此页的样式（也可放到 main.css 最后） -->
  <style>
    .projects-wrapper{
      max-width:1100px;
      margin:60px auto 100px;
      padding:0 1rem;
      text-align:center;
    }
    .projects-title{
      font-size:2.6rem;
      margin:0 0 2.5rem;
      color:var(--brand-teal,#004F59);
      font-family:"Merriweather","Noto Serif SC",serif;
    }

    /* ─── 网格容器 ─── */
    .proj-menu{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:2rem;
      place-items:center;
    }

    /* ─── 单张卡片 ─── */
    .proj-card{
      display:flex;
      align-items:center;
      justify-content:center;
      height:180px;
      padding:1.2rem;
      border-radius:18px;
      color:#fff;
      font-size:1.55rem;
      font-weight:600;
      line-height:1.25;
      text-decoration:none;
      text-align:center;
      box-shadow:0 6px 22px rgba(0,0,0,.08);
      transition:transform .25s,box-shadow .25s;
    }
    .proj-card:hover{
      transform:translateY(-8px);
      box-shadow:0 12px 32px rgba(0,0,0,.12);
    }

    /* ① AI & ML —— 绿松渐变 */
    .card-ai{
      background:linear-gradient(135deg,#01c9b1 0%,#7dfec9 100%);
    }
    /* ② Public-Service —— 天蓝渐变 */
    .card-public{
      background:linear-gradient(135deg,#4a90e2 0%,#8bd5ff 100%);
    }
    /* ③ Academic —— 琥珀渐变 */
    .card-academic{
      background:linear-gradient(135deg,#f5af19 0%,#fad961 100%);
    }
    /* ④ Corporate —— 洋红渐变 */
    .card-consult{
      background:linear-gradient(135deg,#ec008c 0%,#fc6767 100%);
    }

    /* 手机端自适应：更矮、更小字 */
    @media(max-width:640px){
      .proj-card{height:140px;font-size:1.25rem;}
    }
  </style>
{% endblock %}

{% block content %}
  <main class="projects-wrapper">
    <h1 class="projects-title">Projects</h1>

    <!-- 顺序：AI&ML + Public-Service ➜ Academic + Consulting -->
    <div class="proj-menu">
      <a href="{{ url_for('projects_ai') }}"
         class="proj-card card-ai">AI &amp; ML<br>Projects</a>

      <a href="{{ url_for('projects_public_service') }}"
         class="proj-card card-public">Public-Service<br>Analytics</a>

      <a href="{{ url_for('academic_research') }}"
         class="proj-card card-academic">Academic<br>Research</a>

      <a href="{{ url_for('projects_consulting') }}"
         class="proj-card card-consult">Corporate<br>Consulting</a>
    </div>
  </main>
{% endblock %}
