{# templates/projects.html #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% block title %}Projects — Fanmei Wang, PhD{% endblock %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 通用样式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <!-- Font Awesome（仅用到一个图标）-->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  {# 站点统一导航 #}
  {% include "navbar.html" %}

  <main class="container" style="padding:3rem 0 2rem;">
    <h1 class="page-title" style="text-align:center;">Projects</h1>

    <!-- === 2 × 2 方块卡片 === -->
    <div class="card-grid">

      <!-- ① AI & ML Projects -->
      <a href="{{ url_for('projects_ai') }}" class="proj-tile ai">
        <h3>AI &amp; ML<br>Projects</h3>
      </a>

      <!-- ② Public-Service Analytics -->
      <a href="{{ url_for('projects_public_service') }}" class="proj-tile psa">
        <i class="fa-solid fa-file-lines"></i>
        <h3>Public-Service<br>Analytics</h3>
      </a>

      <!-- ③ Academic Research -->
      <a href="{{ url_for('projects_academic') }}" class="proj-tile research">
        <h3>Academic<br>Research</h3>
      </a>

      <!-- ④ Corporate Consulting -->
      <a href="{{ url_for('projects_consulting') }}" class="proj-tile corp">
        <h3>Corporate<br>Consulting</h3>
      </a>

    </div>
  </main>
</body>
</html>
