<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fanmei Wang, PhD | Home</title>

  <!-- Bootstrap 5  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- 站点自定义样式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <!-- ─── 顶部导航栏 ───────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Fanmei Wang, PhD</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarsMain" aria-controls="navbarsMain"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="navbarsMain" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('education') }}">Education</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('teaching_overview') }}">Teaching</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('projects') }}">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('publications') }}">Publications</a></li>
          <li class="nav-item"><a class="nav-link" href="#blog">Research Blog</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ─── 主页 Hero ───────────────────────────────────────── -->
  <header class="py-5 text-center bg-light">
    <img
      class="rounded-circle shadow mb-3"
      src="{{ url_for('static', filename='img/profile.jpg') }}"
      alt="Fanmei Wang profile photo" width="160" height="160"
    >
    <h1 class="display-5 fw-semibold">Hello, Fanmei!</h1>
    <p class="lead">Your Flask app is now using a template.</p>
  </header>

  <!-- ─── 合作 / 院校 Logo 横排 ─────────────────────────────── -->
  <section class="py-4">
    <div class="container text-center">
      {% for uni in edu_list %}
        <img
          src="{{ url_for('static', filename='img/logos/' ~ uni.logo) }}"
          alt="{{ uni.school }} logo"
          class="mx-3 mb-3 partner-logo"    <!-- 可在 main.css 调整尺寸 -->
          width="100" height="100"
        >
      {% endfor %}
    </div>
  </section>

  <!-- ─── 其他内容占位 ─────────────────────────────────────── -->
  <div class="container my-5">
    <p class="text-muted text-center">More sections coming soon…</p>
  </div>

  <!-- Bootstrap JS（如需导航折叠） -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
