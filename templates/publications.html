<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Publications — Fanmei Wang, PhD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 站点公共样式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  {% include "navbar.html" %}

  <!-- 顶部浅色横幅（200px，高度可调） -->
  <header class="pub-hero"></header>

  <!--────────────  双栏主内容  ────────────-->
  <main class="pub-grid">

    <!--── 左：Books ──────────────────────-->
    <section>
      <h2 class="section-title">Books</h2>

      {% for b in books %}
      <article class="book-card" style="animation-delay: {{ loop.index0 * .08 }}s;">
        <img class="book-cover"
             src="{{ url_for('static', filename='img/books/' ~ b.cover) }}"
             alt="{{ b.title }} cover">
        <p class="book-cite">{{ b.cite }}</p>
      </article>
      {% endfor %}
    </section>

    <!--── 右：Journal Articles ───────────-->
    <section>
      <h2 class="section-title">Journal&nbsp;Articles</h2>

      <ul class="article-timeline">
        {% for p in articles %}
        <li style="animation-delay: {{ loop.index0 * .08 }}s;">
          <article class="article-card">
            <span class="article-tag">{{ p.type }}</span>
            <p class="article-cite">{{ p.cite }}</p>
          </article>
        </li>
        {% endfor %}
      </ul>
    </section>

  </main>
</body>
</html>
